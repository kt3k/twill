name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  deno:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: impl/deno
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check
      - run: deno lint
      - run: deno check mod.ts cli.ts
      - run: deno task test

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: impl/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  ocaml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: impl/ocaml
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ocaml ocaml-dune ocaml-findlib
      - run: dune build
      - run: dune test

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: conformance/compare.sh
      - run: conformance/compare_cli.sh
